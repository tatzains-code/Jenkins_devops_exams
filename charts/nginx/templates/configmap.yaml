apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  default.conf: |
    server {
      listen {{ .Values.listenPort }};

      {{- range $name, $u := .Values.upstreams }}

      location {{ $u.path }} {
        proxy_pass http://{{ $u.host }}:{{ $u.port }}{{ $u.path }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }
      {{- end }}

      location = /healthz {
        return 200 "ok\n";
      }
    }
