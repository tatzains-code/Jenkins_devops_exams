{{- $user := required "auth.username is required" .Values.auth.username -}}
{{- $pass := required "auth.password is required" .Values.auth.password -}}
{{- $db := required "auth.database is required" .Values.auth.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $user | quote }}
  POSTGRES_PASSWORD: {{ $pass | quote }}
  POSTGRES_DB: {{ $db | quote }}
  # Ready-made connection string for the application (host = this release's Service)
  DATABASE_URI: {{ printf "postgresql://%s:%s@%s:5432/%s" $user $pass .Release.Name $db | quote }}
